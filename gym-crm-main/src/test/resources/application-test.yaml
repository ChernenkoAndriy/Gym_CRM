application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 3600000
    brute-force:
      max-attempts: 3
      lock-duration-minutes: 5

spring:
  application:
    name: Gym_CRM_Test
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    enabled: true
    change-log: classpath:db.changelog/db.changelog-test.yaml
  jms:
    broker-url: vm://localhost?broker.persistent=false
    template:
      default-destination: trainer-workload-queue-test

app:
  jms:
    queue:
      workload: trainer-workload-queue-test

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

eureka:
  client:
    enabled: false
spring:
  application:
    name: Gym_CRM
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: 86400000 # 24 hours
    brute-force:
      max-attempts: 3
      lock-duration-minutes: 5

resilience4j:
  circuitbreaker:
    instances:
      trainerWorkloadClient:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000ms
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      trainerWorkloadClient:
        timeout-duration: 3s

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: "Gym CRM Application"
    description: "REST API for managing gym trainees, trainers, and training sessions"
    version: "1.0-SNAPSHOT"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
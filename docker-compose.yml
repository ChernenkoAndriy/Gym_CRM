version: '3.8'

services:
  gym-postgres:
    image: postgres:16-alpine
    container_name: gym_crm_postgres
    environment:
      POSTGRES_DB: gym_crm_db
      POSTGRES_USER: gym_admin
      POSTGRES_PASSWORD: gym_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_admin -d gym_crm_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gym-redis:
    image: redis:7-alpine
    container_name: gym_crm_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gym-crm-app:
    build: .
    container_name: gym_crm_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=stg
      - STG_DB_URL=jdbc:postgresql://gym-postgres:5432/gym_crm_db
      - STG_DB_USERNAME=gym_admin
      - STG_DB_PASSWORD=gym_password
      - STG_REDIS_HOST=gym-redis
      - STG_REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      gym-postgres:
        condition: service_healthy
      gym-redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
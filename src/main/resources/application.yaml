spring:
  application:
    name: Gym_CRM
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: "Gym CRM Application"
    description: "REST API for managing gym trainees, trainers, and training sessions"
    version: "1.0-SNAPSHOT"
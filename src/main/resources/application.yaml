spring:
  application:
    name: Gym_CRM
  datasource:
    url: jdbc:postgresql://localhost:5432/gym_crm_db
    username: gym_admin
    password: gym_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
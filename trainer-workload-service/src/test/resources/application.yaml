spring:
  application:
    name: trainer-workload-service-test
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    consumer:
      group-id: trainer-workload-test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.epam.java.specialization.common.dto.TrainerWorkloadRequestDto

app:
  kafka:
    topics:
      trainer-workload: trainer-workload-topic-test
      trainer-workload-dlt: trainer-workload-topic-test.DLT
    retry:
      max-attempts: 2
      backoff-interval-ms: 100

application:
  security:
    jwt:

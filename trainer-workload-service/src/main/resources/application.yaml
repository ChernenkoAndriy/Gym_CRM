server:
  port: ${PORT:8081}

spring:
  application:
    name: trainer-workload-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jms:
    broker-url: ${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}

app:
  jms:
    concurrency: ${JMS_CONCURRENCY:3-10}
    queue:
      workload: ${WORKLOAD_QUEUE_NAME:trainer-workload-queue}
      dlq: ${WORKLOAD_DLQ_NAME:ActiveMQ.DLQ}
    redelivery:
      max-deliveries: ${JMS_MAX_DELIVERIES:3}
      initial-delay: ${JMS_INITIAL_DELAY:1000}
      back-off-multiplier: ${JMS_BACKOFF_MULTIPLIER:2.0}

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

info:
  app:
    name: "Trainer Workload Microservice"
    description: "Microservice for calculating and storing trainers monthly working hours"
    version: "1.0-SNAPSHOT"
spring:
  jms:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin

app:
  jms:
    concurrency: 1-3
    queue:
      workload: trainer-workload-queue
      dlq: ActiveMQ.DLQ
    redelivery:
      max-deliveries: 3
      initial-delay: 1000
      back-off-multiplier: 2.0

logging:
  level:
    root: INFO
    com.epam.java.specialization.trainer_workload: DEBUG
    org.springframework.jms: DEBUG
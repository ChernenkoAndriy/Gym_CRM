spring:
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/trainer_workload_dev_db}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

app:
  kafka:
    topics:
      trainer-workload: ${TRAINER_WORKLOAD_TOPIC:trainer-workload-topic}
      trainer-workload-dlt: ${TRAINER_WORKLOAD_DLT_TOPIC:trainer-workload-topic.DLT}

logging:
  level:
    root: INFO
    com.epam.java.specialization.trainer_workload: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    org.springframework.kafka: DEBUG
server:
  port: ${PORT:8081}

spring:
  jms:
    broker-url: ${PROD_ACTIVEMQ_BROKER_URL:tcp://activemq-prod:61616}
    user: ${PROD_ACTIVEMQ_USER}
    password: ${PROD_ACTIVEMQ_PASSWORD}

app:
  jms:
    concurrency: 5-15
    queue:
      workload: trainer-workload-queue-prod
      dlq: ActiveMQ.DLQ
    redelivery:
      max-deliveries: 5
      initial-delay: 2000
      back-off-multiplier: 2.0

logging:
  level:
    root: WARN
    com.epam.java.specialization.trainer_workload: INFO
    org.springframework.jms: WARN